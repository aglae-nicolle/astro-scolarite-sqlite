name: Deploy AstroJS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # Définir le chemin absolu vers bun (adaptez si which bun donne autre chose)
            BUN_CMD="/home/etudiant/.bun/bin/bun"

            echo "======================================"
            echo "Start deployment"
            echo "======================================"
            # Vérification que bun est trouvé
            if [ ! -f "$BUN_CMD" ]; then
                echo "ERREUR : Bun introuvable à l'adresse $BUN_CMD"
                exit 1
            fi
            echo "Bun found at: $BUN_CMD"
            $BUN_CMD --version

            cd /var/www/scolarite/astro-scolarite-sqlite

            echo "Updating code..."
            git pull origin main

            echo "Installing dependencies..."
            $BUN_CMD ci

            echo "Building Astro..."
            $BUN_CMD run build

            echo "Restarting application..."
            systemctl restart scolarite

            echo "Checking service status..."
            systemctl status scolarite --no-pager

            echo "Health check..."
            curl --fail http://localhost:3000/ || echo "Health check failed"

            echo "======================================"
            echo "Deployment finished"
            echo "======================================"
